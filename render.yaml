# =====================================================================
# Render Blueprint Specification
# Deploys HoneyVault API and Honeychecker as Docker web services on Render
# Region: singapore, Plan: free tier, Branch: dev
# =====================================================================

services:
  # -------------------------------------------------------------------
  # 1. HoneyVault API Service
  # -------------------------------------------------------------------
  - type: web
    name: honeyvault-api
    runtime: docker
    plan: free
    region: singapore
    branch: dev
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEMO_MODE
        value: "true"
      - key: HONEYCORE_IMPL
        value: real
      - key: HONEYCHECKER_TRANSPORT
        value: signed
      - key: HONEYCHECKER_TIMEOUT_SECONDS
        value: "60"
      - key: LOG_LEVEL
        sync: false
      - key: API_PORT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        sync: false
      - key: VAULT_KDF_PROFILE
        sync: false
      - key: HONEYWORDS_K
        sync: false
      - key: HONEYWORDS_KDF_PROFILE
        sync: false
      - key: RATE_LIMIT_LOGIN
        sync: false
      - key: RATE_LIMIT_UNLOCK
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_LOGIN_PASSWORD
        sync: false
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_LOGIN_PASSWORD
        sync: false
      - key: DEMO_MASTER_PASSWORD
        sync: false
      - key: PCFG_PASSWORD_MODEL_PATH
        sync: false
      - key: PCFG_USERNAME_MODEL_PATH
        sync: false
      - key: EVAL_RESULTS_PATH
        sync: false
      - key: KEY_WRAP_SECRET
        sync: false
      - key: ROOT_CA_CERT_B64
        sync: false
      - key: ISSUING_CA_CERT_B64
        sync: false
      - key: ISSUING_CA_KEY_B64
        sync: false
      - key: HONEYCHECKER_URL
        sync: false
      - key: HC_CLIENT_CERT_PATH
        sync: false
      - key: HC_CLIENT_KEY_PATH
        sync: false
      - key: HC_CA_CERT_PATH
        sync: false
      - key: HC_CLIENT_CERT_B64
        sync: false
      - key: HC_CLIENT_KEY_B64
        sync: false

  # -------------------------------------------------------------------
  # 2. Honeychecker Service (Internal Honeyword Verification Oracle)
  # -------------------------------------------------------------------
  - type: web
    name: honeyvault-honeychecker
    runtime: docker
    plan: free
    region: singapore
    branch: dev
    dockerfilePath: ./honeychecker/Dockerfile
    dockerContext: .
    healthCheckPath: /hc/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: HC_TRANSPORT
        value: signed
      - key: LOG_LEVEL
        sync: false
      - key: HC_PORT
        sync: false
      - key: HC_DATABASE_URL
        sync: false
      - key: HC_ALLOWED_CLIENT_CN
        sync: false
      - key: HC_SERVER_CERT_PATH
        sync: false
      - key: HC_SERVER_KEY_PATH
        sync: false
      - key: HC_TRUSTED_CA_CERT_PATH
        sync: false
      - key: HC_TRUSTED_CA_CERT_B64
        sync: false
      - key: HC_ISSUING_CA_CERT_B64
        sync: false
